[workspace]
resolver = "2"

members = [
    "read-fonts",
    "font-types",
    "font-codegen",
    "font-test-data",
    "write-fonts",
    "otexplorer",
    "skrifa",
    "fauntlet",
    "skera",
    "fuzz",
    "shared-brotli-patch-decoder",
    "incremental-font-transfer", "skrifa_cxx",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/googlefonts/fontations"
rust-version = "1.85"

[workspace.dependencies]
# note: bytemuck version must be available in all deployment environments,
# specifically the floor of the versions supported by google3, Chrome and
# Android.
# Chrome: https://chromium.googlesource.com/chromium/src/third_party/rust/+/refs/heads/main/bytemuck/v1/BUILD.gn
# Android: https://android.googlesource.com/platform/external/rust/crates/bytemuck/+/refs/heads/main/Cargo.toml
bytemuck = "1.14.0"
# dev dependencies
env_logger = "0.11"
pretty_assertions = "1.3.0"

core_maths = "0.1"
criterion = "0.7"
kurbo = "0.13.0"
rayon = "1.12"
serde_json = "1.0"

# These allow using the workspace library crates without having to
# update the versions in each crate that uses the libraries or
# having to use the correct path.
# `read-fonts` disables default-features so that it can be used without
# default-features enabled by `skrifa`. Other crates using `read-fonts`
# that want default features will have to enable them directly.
font-test-data = { path = "font-test-data" }
font-types = { version = "0.12.3", path = "font-types" }
read-fonts = { version = "0.42.2", path = "read-fonts", default-features = false }
# Disable default-features so that fauntlet can use skrifa without autohint
# shaping support
skrifa = { version = "0.45.2", path = "skrifa", default-features = false, features = ["std"] }
write-fonts = { version = "0.51.1", path = "write-fonts", default-features = false }
shared-brotli-patch-decoder = { version = "0.1.5", path = "shared-brotli-patch-decoder", default-features = false }
incremental-font-transfer = { version = "0.6.1", path = "incremental-font-transfer" }
skera = { version = "0.5.2", path = "skera" }

[workspace.metadata.release]
allow-branch = ["main"]

[profile.release]
lto = "fat"
codegen-units = 1
