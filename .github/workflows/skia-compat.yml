# Compiles Skia's Rust font bridge against this branch.
#
# Run by hand, not on push or pull request: it builds a consumer that lives in
# another repository, so a red result here is information rather than a gate.
# Nothing else in CI compiles a downstream consumer.

name: Skia compatibility

on:
  workflow_dispatch:
    inputs:
      skia_ref:
        description: "Skia ref to build against"
        default: main
        required: false

permissions:
  contents: read

jobs:
  skia-compat:
    name: compile Skia's font bridge
    runs-on: ubuntu-latest
    steps:
      - name: checkout fontations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fontations

      # Only the bridge and the manifest it pins versions in. Skia is large
      # and none of the rest is needed to compile 2.5k lines of Rust.
      - name: checkout Skia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: google/skia
          ref: ${{ inputs.skia_ref }}
          path: skia
          fetch-depth: 1
          sparse-checkout: |
            src/ports/fontations
            bazel/external/fontations

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: report what is being compared
        run: |
          echo "fontations $(git -C fontations rev-parse --short HEAD) ($(git -C fontations rev-parse --abbrev-ref HEAD))"
          echo "skia       $(git -C skia rev-parse --short HEAD) (${{ inputs.skia_ref }})"

      - name: compile the bridge
        run: fontations/resources/scripts/check_skia_compat.sh skia
